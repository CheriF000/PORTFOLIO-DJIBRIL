<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos Modèle - Djibril Diaw</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        /* Nav */
        nav {
            position: fixed; top: 0; width: 100%;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 24px; font-weight: bold; letter-spacing: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .back-btn {
            color: #fff; text-decoration: none;
            font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
            transition: color 0.3s;
        }

        .back-btn:hover { color: #667eea; }

        /* Page content */
        .page-content {
            padding: 140px 50px 80px;
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 48px; letter-spacing: 3px; text-transform: uppercase;
            text-align: center; margin-bottom: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Grille photos */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery-item {
            aspect-ratio: 3/4;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            background: #111;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 35px rgba(102,126,234,0.3);
        }

        .gallery-item img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }

        /* Lightbox */
        .lightbox {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.96); z-index: 9999;
            justify-content: center; align-items: center;
            flex-direction: column;
        }

        .lightbox.active { display: flex; }

        .lightbox-img-wrap {
            max-width: 90vw; max-height: 85vh;
            display: flex; align-items: center; justify-content: center;
        }

        .lightbox-img-wrap img {
            max-width: 90vw; max-height: 85vh;
            object-fit: contain; border-radius: 8px;
        }

        .lightbox-close {
            position: fixed; top: 18px; right: 18px;
            font-size: 38px; color: #fff; cursor: pointer;
            background: rgba(0,0,0,0.7);
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; z-index: 10001;
        }

        .lightbox-close:hover { background: rgba(255,0,0,0.8); transform: rotate(90deg); }

        .lightbox-nav {
            display: flex; gap: 20px; margin-top: 18px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.15); border: none; color: #fff;
            font-size: 26px; width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.3s;
        }

        .nav-btn:hover { background: linear-gradient(135deg, #667eea, #764ba2); }
        .nav-btn:disabled { opacity: 0.2; cursor: default; }

        .lightbox-counter {
            color: #888; font-size: 13px; margin-top: 8px; letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            nav { padding: 15px 20px; }
            .page-content { padding: 100px 20px 60px; }
            h1 { font-size: 30px; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Djibril Diaw</a>
        <a href="index.html#photos" class="back-btn">← Retour</a>
    </nav>

   <div class="page-content">
        <h1>MODEL</h1>
        <div class="gallery-grid">
            <div class="gallery-item" onclick="openLightbox(0)">
                <img src="model1.jpeg" alt="Modèle 1">
            </div>
            <div class="gallery-item" onclick="openLightbox(1)">
                <img src="model2.jpeg" alt="Modèle 2">
            </div>
            <div class="gallery-item" onclick="openLightbox(2)">
                <img src="model3.jpeg" alt="Modèle 3">
            </div>
            <div class="gallery-item" onclick="openLightbox(3)">
                <img src="model4.jpeg" alt="Modèle 4">
            </div>
            <div class="gallery-item" onclick="openLightbox(4)">
                <img src="model5.jpeg" alt="Modèle 5">
            </div>
            <div class="gallery-item" onclick="openLightbox(5)">
                <img src="model6.jpeg" alt="Modèle 6">
            </div>
        </div>
    </div>


    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">×</span>
        <div class="lightbox-img-wrap">
            <img id="lightbox-img" src="" alt="">
        </div>
        <div class="lightbox-nav">
            <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">&#8592;</button>
            <button class="nav-btn" id="nextBtn" onclick="navigate(1)">&#8594;</button>
        </div>
        <div class="lightbox-counter" id="counter"></div>
    </div>

    <script>
        const photos = ['model1.jpeg','model2.jpeg','model3.jpeg','model4.jpeg','model5.jpeg','model6.jpeg'];
        let current = 0;

        function openLightbox(index) {
            current = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function navigate(dir) {
            current = Math.max(0, Math.min(photos.length - 1, current + dir));
            updateLightbox();
        }

        function updateLightbox() {
            document.getElementById('lightbox-img').src = photos[current];
            document.getElementById('prevBtn').disabled = current === 0;
            document.getElementById('nextBtn').disabled = current === photos.length - 1;
            document.getElementById('counter').textContent = `${current + 1} / ${photos.length}`;
        }

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
        });
    </script>
</body>
</html>
